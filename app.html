<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Todo App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
    }

    .todo-container {
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 50px rgba(30, 20, 80, 0.25);
    }

    h1 {
      color: white;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #f1eaff;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    #taskInput {
      min-width: 0;
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 12px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
    }

    #addBtn {
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #addBtn:hover {
      transform: scale(1.06);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      color: white;
      margin-bottom: 14px;
      font-size: 14px;
    }

    #taskList {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      animation: appear 0.25s ease;
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #764ba2;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: #33264b;
      font-size: 14px;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      border: none;
      background: #ffe4e9;
      color: #e84365;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .delete-btn:hover {
      background: #ffccd5;
    }

    .empty-message {
      text-align: center;
      padding: 25px 10px;
      color: white;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #f1eaff;
      font-size: 12px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .todo-container {
        padding: 22px;
      }

      h1 {
        font-size: 25px;
      }

      #addBtn {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <main class="todo-container">
    <h1>✨ My To-Do List</h1>
    <p class="subtitle">Small steps, big achievements.</p>

    <form class="input-group" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
        aria-label="New task"
        required
      >
      <button type="submit" id="addBtn" aria-label="Add task">+</button>
    </form>

    <div class="task-header">
      <span>Your Tasks</span>
      <span id="taskCount">0 tasks left</span>
    </div>

    <ul id="taskList" aria-live="polite"></ul>

    <p class="footer">💜 Stay focused. Keep going.</p>
  </main>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");

    let tasks = [];

    function renderTasks() {
      taskList.innerHTML = "";

      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent =
        `${remaining} task${remaining !== 1 ? "s" : ""} left`;

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-message";
        empty.textContent = "No tasks yet. Add one above! 🌈";
        taskList.appendChild(empty);
        return;
      }

      tasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task-item";
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Complete task");

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "✕";
        deleteBtn.setAttribute("aria-label", "Delete task");

        deleteBtn.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          renderTasks();
        });

        li.append(checkbox, text, deleteBtn);
        taskList.appendChild(li);
      });
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        completed: false
      });

      taskInput.value = "";
      taskInput.focus();
      renderTasks();
    });

    renderTasks();
  </script>

</body>
</html>
